name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CEF_VERSION_KEY: cef-154.0.32

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: ${{ env.CEF_VERSION_KEY }}-windows64-${{ hashFiles('CMakeLists.txt') }}

      - name: MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_SANDBOX=OFF -DUSE_ATL=OFF 2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --target Shelter --parallel 2>&1 | tee build.log

      - name: Smoke test
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          pip install websocket-client
          python tools/smoke.py build/Release/Shelter.exe smoke 2>&1 | tee smoke-run.log

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/Release "dist/SHELTER"
          Remove-Item -Force -ErrorAction SilentlyContinue dist/SHELTER/*.pdb, dist/SHELTER/*.lib, dist/SHELTER/*.exp
          Compress-Archive -Path dist/SHELTER -DestinationPath dist/SHELTER-windows-x64.zip
          Get-ChildItem dist | Out-String | Tee-Object -FilePath package.log

      - uses: actions/upload-artifact@v4
        with:
          name: SHELTER-windows-x64
          path: dist/SHELTER-windows-x64.zip
          if-no-files-found: error

      - name: Publish logs
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/push_log.sh windows configure.log build.log smoke-run.log package.log smoke/*

  macos:
    name: macOS Intel (x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: ${{ env.CEF_VERSION_KEY }}-macosx64-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPROJECT_ARCH=x86_64 -DCMAKE_OSX_ARCHITECTURES=x86_64 -DUSE_SANDBOX=OFF 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --target Shelter --parallel 2>&1 | tee build.log

      - name: Smoke test
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python3 -m venv .venv && . .venv/bin/activate && pip install websocket-client
          python tools/smoke.py "build/Release/Shelter.app/Contents/MacOS/Shelter" smoke 2>&1 | tee smoke-run.log

      - name: Package
        run: |
          mkdir -p dist
          APP="build/Release/Shelter.app"
          ls "$APP/Contents" "$APP/Contents/Frameworks" "$APP/Contents/Resources"
          codesign --force --deep --sign - "$APP"
          cp -R "$APP" dist/SHELTER.app
          ditto -c -k --keepParent dist/SHELTER.app dist/SHELTER-macos-x64.zip
          hdiutil create -volname SHELTER -srcfolder dist/SHELTER.app -ov -format UDZO dist/SHELTER-macos-x64.dmg
          ls -la dist | tee package.log

      - uses: actions/upload-artifact@v4
        with:
          name: SHELTER-macos-x64
          path: |
            dist/SHELTER-macos-x64.zip
            dist/SHELTER-macos-x64.dmg
          if-no-files-found: error

      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/push_log.sh macos configure.log build.log smoke-run.log package.log smoke/*
